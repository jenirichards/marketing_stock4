<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 434 80">
  
  <!-- Trade icon thumbnail (80×80 rounded) -->
  <g>
    <clipPath id="iconClip">
      <rect width="80" height="80" rx="14"/>
    </clipPath>
    <g clip-path="url(#iconClip)">
      <svg x="0" y="0" width="80" height="80" viewBox="0 0 130 130">
        <defs>
          <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#C2410C"/>
            <stop offset="100%" stop-color="#431407"/>
          </linearGradient>
        </defs>
        <!-- Full-bleed gradient background -->
        <rect width="130" height="130" fill="url(#ibg)"/>
        <ellipse cx="38" cy="36" rx="22" ry="22" fill="#FB923C" fill-opacity="0.28"/>
        <rect x="21" y="28" width="52" height="19" rx="2.5" fill="white" fill-opacity="0.85"/>
        <line x1="21" y1="34" x2="73" y2="34" stroke="#0a1860" stroke-opacity="0.10" stroke-width="1"/>
        <rect x="19" y="49" width="58" height="19" rx="2.5" fill="white" fill-opacity="0.68"/>
        <line x1="19" y1="55" x2="77" y2="55" stroke="#0a1860" stroke-opacity="0.10" stroke-width="1"/>
        <path d="M86,28 C99,52 99,74 94,88"
              stroke="white" stroke-opacity="0.38" stroke-width="5" fill="none" stroke-linecap="round"/>
        <polygon points="88,88 98,88 92,96" fill="white" fill-opacity="0.38"/>
        <rect x="63" y="98" width="47" height="14" rx="2.5" fill="white" fill-opacity="0.58"/>
        <line x1="63" y1="103" x2="110" y2="103" stroke="#0a1860" stroke-opacity="0.08" stroke-width="1"/>
        <line x1="59" y1="99"  x2="49" y2="99"  stroke="white" stroke-opacity="0.38" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="56" y1="105" x2="46" y2="105" stroke="white" stroke-opacity="0.25" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="59" y1="111" x2="49" y2="111" stroke="white" stroke-opacity="0.15" stroke-width="1.4" stroke-linecap="round"/>
        
    <g transform="translate(85,44) scale(0.8)">
      <circle cx="15" cy="15" r="17" fill="white" fill-opacity="0.18"/>
      <polyline points="0,14 15,1 30,14" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="3"  y="14" width="24" height="14" fill="none" stroke="white" stroke-width="2.5"/>
      <rect x="11" y="21" width="8"  height="7"  rx="1" fill="none" stroke="white" stroke-width="2"/>
    </g>
      </svg>
    </g>
  </g>
  <!-- "Stock4 TradeName" text -->
  <text x="98" y="55"
        font-family="Liberation Sans, Arial, sans-serif"
        font-size="44"
        font-weight="500"
        fill="#C2410C">Stock4 Building</text>
</svg>